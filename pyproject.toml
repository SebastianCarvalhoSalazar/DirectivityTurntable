[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "directivity"
version = "0.1.0"
description = "Mesa giratoria automatizada para medir patrones de directividad de parlantes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sebastian Carvalho Salazar" }]
dependencies = [
    "numpy>=1.26",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyserial>=3.5",
]

[project.scripts]
directivity = "directivity.adapters.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/directivity"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# python/ es el cliente heredado (se elimina en la Fase 6); docs/ es solo Markdown.
extend-exclude = ["python", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "SIM", "RUF"]
ignore = [
    "D107",  # los argumentos del constructor se documentan en el docstring de la clase
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware' --strict-markers"
markers = [
    "hardware: requiere la mesa conectada; se activa con -m hardware --port <puerto>",
]

[tool.coverage.run]
source = ["directivity"]
branch = true
